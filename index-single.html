<style>
/* Hybrid Athlete Tracker & Ducky Coach
   Visual idea: a training-room scoreboard. Dark mat, chalk text, duck-yellow for the thing you act on.
   The four blocks wear BJJ belt colours; day types have their own colour; the rest timer is the loud element. */

:root {
  --mat: #0d0f12;
  --canvas: #14181e;
  --tape: #1d222a;
  --raise: #262c36;
  --line: #2a303b;
  --chalk: #ece7dc;
  --dust: #8d93a0;
  --dim: #7a8291;
  --duck: #ffc42e;
  --duck-ink: #1a1300;
  --done: #3ddc97;
  --done-rgb: 61, 220, 151;
  --warn: #ff9a4d;
  --bad: #ff6b6b;

  --b-white: #e9e6df;
  --b-blue: #3a79f0;
  --b-purple: #9558e8;
  --b-brown: #a2663a;

  --f-num: "Big Shoulders", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "Avenir Next Condensed", system-ui, sans-serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: 62px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
body {
  margin: 0; background: var(--mat); color: var(--chalk);
  font: 400 16px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--duck); }
b, strong { font-weight: 600; }
small { font-size: 13px; }
:focus-visible { outline: 2px solid var(--duck); outline-offset: 2px; border-radius: 6px; }
.dg, .cl { display: inline-block; text-align: center; }
.dg { width: .54em; }
.cl { width: .26em; }
.muted { color: var(--dust); }
.dim { color: var(--dim); }
.ico { width: 20px; height: 20px; flex: none; }

/* ------------------------------------------------------------------ shell */
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; }
#view { padding: 14px 0 calc(var(--nav-h) + var(--safe-b) + 40px); min-height: 100vh; }
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding-bottom: var(--safe-b); background: rgba(13, 15, 18, .94); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
#nav .navin { display: flex; width: 100%; max-width: 560px; }
.nav-btn {
  flex: 1; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--dim); font-size: 11.5px; font-weight: 500; position: relative;
}
.nav-btn.on { color: var(--duck); }
.nav-btn.on::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--duck); }
.nav-btn .ico { width: 24px; height: 24px; }
.pill {
  position: fixed; z-index: 19; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
  display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 999px;
  background: var(--duck); color: var(--duck-ink); font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
}
.pill { width: max-content; max-width: calc(100vw - 32px); white-space: nowrap; }      /* left:50% would otherwise cap the width at half the screen */
.pill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill b { flex: none; font: 700 18px var(--f-num); font-variant-numeric: tabular-nums; }
#toast {
  position: fixed; z-index: 80; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 20px); transform: translate(-50%, 20px);
  background: var(--chalk); color: var(--mat); padding: 10px 16px; border-radius: 12px; font-weight: 500; opacity: 0;
  pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.in-workout #toast { top: calc(env(safe-area-inset-top, 0px) + 70px); bottom: auto; transform: translate(-50%, -12px); }
.in-workout #toast.on { transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 12px; font-weight: 600; font-size: 16px; text-decoration: none; transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--duck); color: var(--duck-ink); }
.btn-ghost { background: var(--tape); color: var(--chalk); border: 1px solid var(--line); }
.btn-quiet { color: var(--dust); }
.btn-danger { background: var(--bad); color: #1d0505; }
.btn-block { display: flex; width: 100%; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14.5px; border-radius: 10px; }
.btn .ico { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 auto; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.link { color: var(--duck); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.link.danger { color: var(--bad); display: block; margin-top: 14px; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--dust); flex: none; }
.icon-btn:active { background: var(--tape); }
.in {
  width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; background: var(--tape); border: 1px solid var(--line);
  color: var(--chalk); font-size: 16px; appearance: none; -webkit-appearance: none;
}
select.in { background-image: linear-gradient(45deg, transparent 50%, var(--dust) 50%), linear-gradient(135deg, var(--dust) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { resize: none; }
.in-big { font: 700 34px var(--f-num); min-height: 60px; text-align: center; }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 14px; color: var(--dust); margin-bottom: 6px; }
.field > small { display: block; margin-top: 6px; color: var(--dim); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch-row b { display: block; font-weight: 500; }
.switch-row small { display: block; color: var(--dim); margin-top: 2px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--raise); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
.switch input:checked + i { background: var(--duck); }
.switch input:checked + i::after { transform: translateX(20px); background: var(--duck-ink); }
.switch input:focus-visible + i { outline: 2px solid var(--duck); outline-offset: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 99px; background: var(--tape); border: 1px solid var(--line); font-size: 14.5px; white-space: nowrap; }
.chip:active { background: var(--raise); }
.chip-quiet { color: var(--dim); background: none; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 99px; background: var(--tape); color: var(--dust); font-size: 12.5px; font-weight: 500; }
.tag-warn { background: rgba(255, 154, 77, .14); color: var(--warn); }
.tag-deload { background: rgba(var(--done-rgb), .14); color: var(--done); }
.tag-duck { background: rgba(255, 196, 46, .14); color: var(--duck); }
.card { background: var(--canvas); border-radius: 16px; padding: 16px; margin-top: 14px; }
.hint, .banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.banner p { flex: 1 1 200px; }
.hint { background: var(--tape); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14.5px; }
.result { margin-top: 14px; color: var(--chalk); }
.result.warn { color: var(--warn); }
.result b { font: 700 24px var(--f-num); }
.empty { padding: 18px 0; }

/* --------------------------------------------------------------- page heads */
.page-head { padding: 6px 0 4px; }
.page-head h1 { font: 700 40px/1 var(--f-num); letter-spacing: -.005em; }
.page-head p { color: var(--dust); margin-top: 4px; }
.belt { display: inline-block; width: 38px; height: 10px; border-radius: 2px; background: var(--belt, var(--b-white)); position: relative; flex: none; }
.belt::after { content: ""; position: absolute; right: 6px; top: 0; bottom: 0; width: 7px; background: #0b0b0b; }
.belt-white { --belt: var(--b-white); }
.belt-blue { --belt: var(--b-blue); }
.belt-purple { --belt: var(--b-purple); }
.belt-brown { --belt: var(--b-brown); }

/* day kinds */
.k-strength { --k: #ffc42e; --k-rgb: 255, 196, 46; }
.k-bjj { --k: #8aa0ff; --k-rgb: 138, 160, 255; }
.k-recovery { --k: #3ddc97; --k-rgb: 61, 220, 151; }
.k-speed { --k: #ff8f4d; --k-rgb: 255, 143, 77; }
.k-rest { --k: #6a7282; --k-rgb: 106, 114, 130; }

/* ------------------------------------------------------------------- Today */
.hero { padding: 4px 0 6px; }
.hero-belt { display: flex; align-items: center; gap: 10px; color: var(--dust); font-size: 14px; }
.hero-block { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.hero-week { font: 600 22px/1 var(--f-num); color: var(--dust); display: flex; align-items: baseline; gap: 10px; }
.hero-week b { font: 700 76px/.85 var(--f-num); color: var(--chalk); letter-spacing: -.01em; }
.hero-sub { color: var(--dust); margin-top: 8px; }
.hero-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; min-height: 4px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.ds { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 9px 0 10px; border-radius: 12px; background: var(--canvas); color: var(--dust); }
.ds-dow { font-size: 12.5px; }
.ds-num { font: 700 25px/1.1 var(--f-num); color: var(--chalk); }
.ds-bar { width: 18px; height: 3px; border-radius: 3px; background: var(--k); margin-top: 3px; }
.ds.sel { background: var(--raise); box-shadow: inset 0 0 0 2px var(--chalk); }
.ds.today .ds-dow { color: var(--duck); font-weight: 600; }
.ds-done { position: absolute; top: -5px; right: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--done); color: var(--mat); display: flex; align-items: center; justify-content: center; }
.ds-done .ico { width: 12px; height: 12px; stroke-width: 3; }
.day-head { margin-top: 22px; }
.day-title { font: 700 32px/1.05 var(--f-num); }
.day-date { color: var(--dust); margin-top: 3px; }
.run-main { display: flex; gap: 16px; align-items: center; }
.run-hr { text-align: center; flex: none; }
.run-num { display: block; font: 700 44px/.9 var(--f-num); color: var(--done); letter-spacing: -.01em; }
.run-num i { font-style: normal; color: var(--dim); padding: 0 2px; }
.run-unit { color: var(--dust); font-size: 13px; }
.run-txt h3 { font-size: 17px; }
.run-txt p { color: var(--dust); margin-top: 2px; }
.run-txt small { display: block; color: var(--dim); margin-top: 4px; }
.mark { margin-top: 14px; width: 100%; min-height: 44px; border-radius: 10px; background: var(--tape); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
.mark.on { background: rgba(var(--done-rgb), .14); border-color: transparent; color: var(--done); }
.mark .ico { width: 18px; height: 18px; stroke-width: 3; }
.wcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wcard-head h3 { font: 700 24px var(--f-num); }
.wcard-head span { color: var(--dust); font-size: 14px; }
.deload-note { margin-top: 8px; color: var(--done); font-size: 14.5px; }
.plist { margin-top: 10px; }
.p-sec { margin-top: 14px; padding-bottom: 4px; color: var(--dust); font-size: 13.5px; font-weight: 600; border-bottom: 1px solid var(--line); }
.p-row { display: grid; grid-template-columns: 1fr auto auto; column-gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.p-row:last-child { border-bottom: 0; }
.p-name { font-weight: 500; min-width: 0; }
.p-name em { font-style: normal; color: var(--dust); font-size: 12.5px; background: var(--tape); border-radius: 99px; padding: 1px 7px; margin-left: 4px; white-space: nowrap; }
.p-meta { color: var(--dust); font: 600 15px var(--f-num); letter-spacing: .01em; text-align: right; }
.p-w { font: 700 17px var(--f-num); color: var(--duck); min-width: 62px; text-align: right; }
.p-group { margin: 10px 0 2px; padding: 4px 0 2px 12px; border-left: 3px solid var(--duck); }
.p-group.g-contrast { border-left-color: var(--warn); }
.p-ghead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.p-ghead span { color: var(--dust); font-size: 13.5px; }
.p-group ul .p-row:last-child { border-bottom: 0; }
.logged { display: flex; align-items: center; gap: 8px; color: var(--done); margin-top: 12px; font-size: 14.5px; }
.logged .ico { width: 16px; height: 16px; stroke-width: 3; }
.wcard-go { margin-top: 16px; display: grid; gap: 8px; }
.bjj-effort { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bjj-num { font: 700 56px/.9 var(--f-num); color: #8aa0ff; }
.bjj-lab { color: var(--dust); }
.bjj-effort p { flex: 1 1 100%; color: var(--dust); }
.bjj-focus { margin-top: 12px; }
.restday h3 { font: 700 24px var(--f-num); }
.restday p { color: var(--dust); margin-top: 6px; }

/* ----------------------------------------------------------------- Program */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; color: var(--dust); font-size: 13px; }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k); }
.blk { margin-top: 26px; }
.blk-head { display: flex; gap: 12px; align-items: flex-start; }
.blk-head .belt { margin-top: 9px; }
.blk-head h2 { font: 700 24px/1.1 var(--f-num); }
.blk-head p { color: var(--dust); font-size: 14px; margin-top: 3px; }
.wrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.wnum { width: 34px; font: 700 18px var(--f-num); color: var(--dim); flex: none; }
.wrow.cur .wnum { color: var(--duck); }
.wdays { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dc { aspect-ratio: 1.1; border-radius: 8px; background: rgba(var(--k-rgb), .13); color: var(--k); font: 700 16px var(--f-num); display: flex; align-items: center; justify-content: center; }
.dc.done { background: var(--k); color: var(--mat); }
.dc.today { box-shadow: 0 0 0 2px var(--chalk); }
.wtag { font-size: 11.5px; color: var(--done); width: 40px; flex: none; text-align: right; }
.wrow:not(:has(.wtag)) .wdays { margin-right: 50px; }

/* ------------------------------------------------------------------- Lifts */
.lift { padding: 20px 0 18px; border-bottom: 1px solid var(--line); }
.lift-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.lift-head h2 { font: 700 26px var(--f-num); }
.lift-head p { color: var(--dust); font-size: 14px; }
.lift-num { text-align: right; }
.lift-num b { font: 700 54px/.85 var(--f-num); display: block; }
.lift-num small { color: var(--dust); }
.spark { width: 100%; height: 44px; color: var(--duck); margin-top: 8px; }
.note-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding: 10px 12px; background: var(--tape); border-radius: 10px; border-left: 3px solid var(--warn); }
.note-row p { font-size: 14px; color: var(--chalk); }
.proj { overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; scrollbar-width: thin; }
.proj table { border-collapse: separate; border-spacing: 4px 0; }
.proj th { font: 600 13px var(--f-num); color: var(--dim); padding: 4px 0 4px; min-width: 50px; box-shadow: inset 0 3px 0 var(--belt-c, var(--b-white)); }
.proj th.bk-white { --belt-c: var(--b-white); } .proj th.bk-blue { --belt-c: var(--b-blue); }
.proj th.bk-purple { --belt-c: var(--b-purple); } .proj th.bk-brown { --belt-c: var(--b-brown); }
.proj th.cur { color: var(--duck); }
.proj td { text-align: center; padding: 6px 0; background: var(--canvas); border-radius: 8px; }
.proj td.dl { opacity: .65; }
.proj td.cur { background: var(--raise); }
.proj td b { display: block; font: 700 18px var(--f-num); }
.proj td small { display: block; font-size: 11.5px; color: var(--dust); }
.lift-act { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.lift-act .btn { min-height: 42px; }
.calc h3, .hist h2 { font: 700 24px var(--f-num); }
.calc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; margin-top: 12px; }
.calc-row label { font-size: 14px; color: var(--dust); }
.calc-row label .in { margin-top: 6px; }
.calc-out { margin-top: 12px; font-size: 17px; }
.calc-out b { font: 700 30px var(--f-num); color: var(--duck); }
.hist { margin-top: 28px; }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hrow b { display: block; font-weight: 500; }
.hrow span { color: var(--dust); font-size: 13.5px; }

/* ------------------------------------------------------------------ Ducky */
.chat { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; padding-bottom: 8px; }
.chat-empty { text-align: center; color: var(--dust); padding: 36px 24px; }
.chat-empty .ico-duck { width: 54px; height: 54px; color: var(--duck); margin-bottom: 8px; }
.msg.me { align-self: flex-end; max-width: 86%; background: var(--duck); color: var(--duck-ink); padding: 10px 14px; border-radius: 18px 18px 4px 18px; font-weight: 500; }
.msg.duck { display: flex; gap: 10px; align-items: flex-start; max-width: 96%; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--duck); color: var(--duck-ink); display: flex; align-items: center; justify-content: center; }
.avatar .ico { width: 22px; height: 22px; }
.bubble { background: var(--canvas); padding: 10px 14px; border-radius: 4px 18px 18px 18px; min-width: 0; overflow-wrap: anywhere; }
.bubble p + p, .bubble ul, .bubble ol { margin-top: 8px; }
.bubble ul { list-style: disc; padding-left: 20px; }
.bubble ol { list-style: decimal; padding-left: 22px; }
.bubble li { margin-top: 3px; }
.bubble code { background: var(--tape); padding: 1px 5px; border-radius: 5px; font-size: 14px; }
.yt { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--tape); text-decoration: none; font-weight: 500; }
.yt .ico { width: 16px; height: 16px; }
.mods { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--tape); }
.mods li { margin: 0 0 4px; }
.mods .btn { margin-top: 8px; width: 100%; }
.applied { display: flex; align-items: center; gap: 8px; color: var(--done); margin-top: 8px; }
.applied .ico { width: 16px; height: 16px; stroke-width: 3; }
.msg.err { align-self: center; color: var(--bad); background: rgba(255, 107, 107, .1); padding: 10px 14px; border-radius: 12px; font-size: 14.5px; }
.typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--dust); animation: blink 1.1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer {
  position: sticky; bottom: calc(var(--nav-h) + var(--safe-b) + 8px); display: flex; gap: 8px; align-items: flex-end;
  background: var(--mat); padding: 8px 0;
}
.composer textarea { flex: 1; min-height: 48px; max-height: 140px; padding: 12px 14px; border-radius: 24px; background: var(--tape); border: 1px solid var(--line); line-height: 1.35; }
.send { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--duck); color: var(--duck-ink); display: flex; align-items: center; justify-content: center; }

/* ---------------------------------------------------------------- Settings */
.set-sec { margin-top: 28px; }
.set-sec h2 { font: 700 26px var(--f-num); }
.set-sec > .muted { margin-top: 4px; }
.steps { margin: 14px 0 0 20px; list-style: decimal; color: var(--dust); font-size: 14.5px; }
.steps li { margin-top: 4px; }

/* ------------------------------------------------------------------- sheet */
.sheet-bd { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .62); animation: fade .18s ease-out; }
.sheet {
  position: fixed; z-index: 51; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  background: var(--canvas); border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + var(--safe-b)); animation: rise .22s ease-out;
}
.sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font: 700 28px var(--f-num); }
.sheet-body { padding-top: 6px; }
.sheet-body .btn-block, .sheet-body .field + .btn { margin-top: 16px; }
.sheet-body .day-head { margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 8px 0 16px; }
.stats b { display: block; font: 700 34px/1 var(--f-num); }
.stats span { color: var(--dust); font-size: 13.5px; }
.deltas { margin: 4px 0 8px; }
.deltas li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.deltas .up { color: var(--done); } .deltas .down { color: var(--warn); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translate(-50%, 28px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* --------------------------------------------------------- live workout */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--mat); display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.overlay.hidden { display: none; }
.wk-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 8px; padding-top: max(10px, env(safe-area-inset-top)); }
.wk-title { flex: 1; min-width: 0; }
.wk-title b { display: block; font: 700 21px/1.1 var(--f-num); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-title span { color: var(--dust); font-size: 13px; }
.wk-clock { font: 700 24px var(--f-num); font-variant-numeric: tabular-nums; color: var(--dust); }
.wk-prog { height: 3px; background: var(--tape); }
.wk-prog i { display: block; height: 100%; background: var(--done); transition: width .25s; }
.wk-body { flex: 1; overflow-y: auto; padding: 4px 16px 240px; overscroll-behavior: contain; }
.wk-sec { margin-top: 24px; font-size: 13.5px; font-weight: 600; color: var(--dust); }
.ex { padding: 16px 0 12px; border-top: 1px solid var(--line); }
.wk-body > .wk-sec + .ex, .wk-body > .ex:first-child { border-top: 0; }
.ex-head { display: flex; align-items: center; gap: 12px; }
.thumb { flex: none; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--tape); color: var(--chalk); }
.thumb .ico { width: 24px; height: 24px; }
.thumb-img { overflow: hidden; background: var(--raise); }
.thumb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.t-main { color: var(--duck); } .t-tendon { color: #7fd6c2; } .t-plyo, .t-contrast { color: var(--warn); } .t-push, .t-pull { color: #8aa0ff; }
.t-core { color: #d79bff; } .t-sprint, .t-drill { color: #ff8f4d; } .t-mobility, .t-warmup { color: var(--done); }
.ex-id { flex: 1; min-width: 0; }

<script>
/* ---- guard.js ---- */
/* guard.js — loads before every other script.
   If the app cannot start (a script was blocked or broken, a file is missing, the file was edited after it was
   built), it says so on screen, in plain words, instead of leaving a blank page. It does nothing while the app
   starts normally. Kept tiny and independent of the other modules, so it still runs when they do not. */
(function (root) {
  'use strict';
  var doc = root.document;
  if (!doc || !doc.addEventListener) return;                       // not a browser (the Node tests load modules without a page)

  var problems = [], blocked = false, missing = false, shown = false;
  function note(s) {
    s = String(s || '').replace(/\s+/g, ' ').slice(0, 200);
    if (s && problems.indexOf(s) < 0 && problems.length < 8) problems.push(s);
  }
  function started() { return !!(root.HA && root.HA.app); }       // app.js sets HA.app as its very last step

  root.addEventListener('error', function (e) {                   // capture phase: also sees <script src> files that failed to load
    var t = e && e.target;
    if (t && t !== root && t.tagName === 'SCRIPT') { missing = true; note('Could not load ' + (t.getAttribute('src') || 'a script')); }
    else if (e && e.message) note(e.message);
  }, true);
  doc.addEventListener('securitypolicyviolation', function (e) {
    var d = String(e.effectiveDirective || e.violatedDirective || '');
    if (/^script-src/.test(d)) blocked = true;
    note('Blocked by the security policy: ' + d + ' ' + (e.blockedURI || ''));
  });

    blocked: {
      en: 'A script in this file no longer matches the fingerprint the browser expects, so the browser blocked it. This happens when index.html was edited, re-saved, copied through another app, or changed by a host. Upload the original index.html again, unchanged.',
      lv: 'Kāds skripts failā vairs neatbilst kontrolkodam, ko gaida pārlūks, tāpēc tas to bloķēja. Tā notiek, ja index.html ir rediģēts, atkārtoti saglabāts, kopēts caur citu lietotni vai mainīts hostingā. Augšupielādē oriģinālo index.html vēlreiz, neko nemainot.'
    },
    missing: {
      en: 'A file the app needs could not be loaded. Upload every file of the app in the same folders, or use the single-file index.html.',
      lv: 'Nevarēja ielādēt kādu no lietotnes failiem. Augšupielādē visus lietotnes failus tajās pašās mapēs vai izmanto vienu failu index.html.'
    },
    error: {
      en: 'The app hit an error while starting. The details below say where.',
      lv: 'Startējot lietotni, radās kļūda. Detaļas ir zemāk.'
    },
    silent: {
      en: 'The app scripts did not run. The page may be open as plain text or a preview, or JavaScript is off. Open the app from its web address (for example the github.io address), not from the code view or a downloaded file.',
      lv: 'Lietotnes skripti nedarbojās. Lapa var būt atvērta kā teksts vai priekšskatījums, vai JavaScript ir izslēgts. Atver lietotni no tās tīmekļa adreses (piemēram, github.io), nevis no koda skata vai lejupielādēta faila.'
    }
  };

    var n = doc.createElement(tag);
    if (css) n.style.cssText = css;
    if (text) n.textContent = text;
    return n;
  }
  function show() {
    if (shown || !doc.body) return;
    shown = true;
    var msg = blocked ? TEXT.blocked : missing ? TEXT.missing : problems.length ? TEXT.error : TEXT.silent;
    var wrap = el('div', 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;overflow:auto;background:#0d0f12;color:#ece7dc;' +
      'padding:28px 20px 40px;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif');
    wrap.id = 'ha-guard'; wrap.setAttribute('role', 'alert');
    wrap.appendChild(el('h1', 'margin:0 0 4px;font-size:22px', 'The app could not start'));
    wrap.appendChild(el('p', 'margin:0 0 16px;color:#a9a396', 'Lietotne neuzsāka darbu.'));
    wrap.appendChild(el('p', 'margin:0 0 12px', msg.en));
    wrap.appendChild(el('p', 'margin:0 0 20px;color:#a9a396', msg.lv));
    var info = problems.concat(['Address: ' + (root.location && root.location.href), 'Browser: ' + (root.navigator && root.navigator.userAgent)]).join('\n');
    wrap.appendChild(el('pre', 'margin:0 0 20px;padding:12px;border-radius:8px;background:#171a20;color:#cfc9bb;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word', info));
    var btn = el('button', 'padding:12px 20px;border:0;border-radius:8px;background:#ece7dc;color:#0d0f12;font:600 16px system-ui,sans-serif', 'Reload / Pārlādēt');
    btn.addEventListener('click', function () { root.location.reload(); });
    wrap.appendChild(btn);
    doc.body.appendChild(wrap);

      w = kg != null ? wTxt(c, ex.liftKey, kg) : pct(ex.pct);
    }
    return '<li class="p-row"><span class="p-name">' + esc(ex.name) + (ex.note ? ' <em>' + esc(ex.note) + '</em>' : '') + '</span>' +
           (meta ? '<span class="p-meta">' + esc(meta) + '</span>' : '') + (w ? '<span class="p-w">' + esc(w) + '</span>' : '') + '</li>';
  }
  function previewList(c, wk) {
    var h = '<ul class="plist">';
    wk.items.forEach(function (it) {
      if (it.kind === 'section') h += '<li class="p-sec">' + esc(it.title) + '</li>';
      else if (it.kind === 'ex') h += pRow(c, it.ex);
      else {
        h += '<li class="p-group g-' + it.variant + '"><div class="p-ghead"><b>' + esc(it.label) + '</b><span>' + esc(it.sub) + ', ' + it.rounds + ' rounds</span></div><ul>' +
             it.exs.map(function (e) { return pRow(c, e); }).join('') + '</ul></li>';
      }
    });
    return h + '</ul>';
  }
  function paceSource(pr) {
    return (pr.src === 'runs' ? 'From your ' + (pr.n === 1 ? 'last run' : pr.n + ' recent runs') : 'From your race result') + (pr.assumedRest ? ', resting heart rate assumed 60' : '');
  }
  function paceLine(c) {
    var u = c.S.settings.paceUnit || 'km', pr = Z.paceRange(c.S, c.today);
    if (pr.ok) return '<p class="run-pace"><b>' + Z.paceText(pr, u) + '</b> target pace</p><small>' + paceSource(pr) + '. A guide: heat, hills and fatigue move it.</small>';
    if (pr.why === 'ref') return '<button class="link" data-act="goto-settings" data-focus="pace">Add a run or a race time to see your target pace</button>';
    return '';
  }
  function zoneCard(c, wk) {
    var z = E.zone2(c.S.settings), done = !!c.S.marks[wk.wid + ':am'];
    var h = '<div class="card run"><div class="run-main">';
    if (z) {
      h += '<div class="run-hr"><span class="run-num">' + z.lo + '<i>–</i>' + z.hi + '</span><span class="run-unit">bpm</span></div>' +
           '<div class="run-txt"><h3>Morning Zone 2 run</h3><p>' + esc(wk.am.minLo + '–' + wk.am.minHi) + ' min, easy and conversational. Fuel after.</p>' +
           '<small>' + (z.method === 'karvonen' ? 'Karvonen, ' + z.loPct + '–' + z.hiPct + '% of heart-rate reserve' : z.loPct + '–' + z.hiPct + '% of max heart rate') + ', max ' + z.mhr + '</small>' + paceLine(c) + '</div>';
    } else {
      h += '<div class="run-txt"><h3>Morning Zone 2 run</h3><p>' + esc(wk.am.text) + '</p>' +
           '<button class="link" data-act="goto-settings" data-focus="hr">Add your age to see your target heart rate</button></div>';
    }
    h += '</div><div class="run-tools"><button class="btn btn-ghost" data-act="live-open">' + ICON.pulse + 'Live heart rate</button><button class="btn btn-ghost" data-act="run-log">Log a run</button></div>' +
         '<button class="mark' + (done ? ' on' : '') + '" data-act="mark" data-key="' + wk.wid + ':am" aria-pressed="' + done + '">' + (done ? ICON.check + 'Run done' : 'Mark run done') + '</button></div>';
    return h;
  }
  function startBar(c, wk) {
    var a = c.S.active, label = wk.kind === 'recovery' ? 'Start routine' : wk.kind === 'speed' ? 'Start session' : 'Start workout';
    var data = ' data-w="' + wk.week + '" data-d="' + wk.day + '"';
    if (a && a.wid === wk.wid) return '<button class="btn btn-primary btn-block" data-act="wk-resume">' + ICON.play + 'Resume workout</button>';
    if (a) return '<button class="btn btn-primary btn-block" data-act="wk-resume">' + ICON.play + 'Resume current workout</button>' +
                  '<button class="btn btn-ghost btn-block" data-act="start" data-replace="1"' + data + '>Discard it and start this one</button>';
    return '<button class="btn btn-primary btn-block" data-act="start"' + data + '>' + ICON.play + label + '</button>';
  }
  function workoutCard(c, wk) {
    var sets = 0, n = 0, lifts = {};
    P.flatExs(wk).forEach(function (e) { if (e.mode !== 'check') { sets += e.sets; n++; } if (e.liftKey) lifts[e.liftKey] = 1; });
    var missing = Object.keys(lifts).filter(function (k) { return !liftRM(c, k); });
    var logs = c.S.logs.filter(function (l) { return l.wid === wk.wid; });
    var h = '<div class="card wcard"><div class="wcard-head"><h3>' + (wk.am ? 'Evening session' : 'Session') + '</h3><span>' + (n ? n + ' exercises, ' + sets + ' sets' : 'Checklist') + '</span></div>';
    if (wk.deload) h += '<p class="deload-note"><b>Deload week.</b> Weights drop to ' + pct(E.DELOAD_PCT) + ' of 1RM and volume is cut.</p>';
    if (missing.length) h += '<div class="hint"><span>Enter your 1RMs and weights fill in for you.</span><button class="link" data-act="goto-lifts">Set 1RMs</button></div>';
    h += previewList(c, wk);
    if (logs.length) {
      var l = logs[logs.length - 1], cnt = 0; l.entries.forEach(function (e) { cnt += e.sets.length; });
      h += '<p class="logged">' + ICON.check + 'Logged ' + longDate(l.date) + ', ' + cnt + ' sets' + (l.volumeKg ? ', ' + fmtInt(E.toDisp(l.volumeKg, units(c))) + ' ' + units(c) + ' lifted' : '') + '</p>';
    }
    return h + '<div class="wcard-go">' + startBar(c, wk) + '</div></div>';
  }
  function bjjCard(c, wk) {
    var done = !!c.S.marks[wk.wid], num = effortNum(wk.effort);
    return '<div class="card bjj">' +
      '<div class="bjj-effort">' + (num ? '<span class="bjj-num">' + num + '</span><span class="bjj-lab">effort</span>' : '') + '<p>' + esc(wk.effort) + '</p></div>' +
      '<p class="bjj-focus">' + esc(wk.focus) + '</p>' +
      '<button class="mark' + (done ? ' on' : '') + '" data-act="mark" data-key="' + wk.wid + '" aria-pressed="' + done + '">' + (done ? ICON.check + 'Trained' : 'Mark as trained') + '</button></div>';
  }
  function restCard(c, wk) {
    var done = !!c.S.marks[wk.wid];
    return '<div class="card restday"><h3>Full rest</h3><p>No training. Sleep, eat well, walk if you feel like it. This is when the work from the week turns into adaptation.</p>' +
           '<button class="mark' + (done ? ' on' : '') + '" data-act="mark" data-key="' + wk.wid + '" aria-pressed="' + done + '">' + (done ? ICON.check + 'Rested' : 'Mark as rested') + '</button></div>';
  }
  function gcalLine(g) {
    if (!g.tokenOk) return '<button class="link" data-act="gcal-sync">Google Calendar: tap to sign in and sync</button>';
    return g.pending ? '<button class="link" data-act="gcal-sync">' + g.pending + (g.pending === 1 ? ' change is' : ' changes are') + ' not in Google Calendar yet. Sync now</button>' : 'In step with Google Calendar.';
  }
  function sessionList(c, wk, iso) {
    var list = SC.dayList(c.S, wk.week, wk.day).filter(function (e) { return !e.allDay; });
    if (!list.length) return '';
    var g = c.gcal, h = '<ul class="sched" aria-label="Session times">';
    list.forEach(function (e) {
      h += '<li><span class="sc-time">' + e.start + '–' + SC.endTime(e) + '</span><span class="sc-name">' + esc(e.label) +
           (e.date !== iso ? '<small>Moved to ' + longDate(e.date) + '</small>' : '') + '</span>' +
           '<button class="link" data-act="move-open" data-uid="' + e.uid + '" aria-label="Change time: ' + esc(e.label) + '">Change</button></li>';
    });
    h += '</ul>';
    if (g && g.on) h += '<p class="sched-sync">' + gcalLine(g) + '</p>';
    else h += calLinks(c, list);
    return h;
  }
  // One-tap "add to Google Calendar" links: a plain web address, no sign-in, nothing that can fail inside the app.
  function calLinks(c, list) {
    return '<div class="cal-links">' + list.map(function (e) {
      var f = SC.oneEvent(c.S, e.uid, true, c.today) || e, d = f.desc ? String(f.desc) : '';
      if (d.length > 700) d = d.slice(0, 700) + '…';                  // keeps the address short enough for every browser
      var link = E.googleLink({ title: f.title, date: f.date, start: f.start, mins: f.mins, desc: d + (f.note ? '\n' + f.note : '') });
      return '<a class="link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Add ' + esc(String(e.label).toLowerCase()) + ' to Google Calendar</a>';
    }).join('') + '</div>';
  }
  function dayBody(c, wk, iso) {
    var h = '<section class="day"><div class="day-head"><h2 class="day-title">' + esc(wk.shortTitle) + '</h2><p class="day-date">' + longDate(iso) + ', day ' + wk.day + '</p></div>';
    h += sessionList(c, wk, iso);
    if (wk.am) h += zoneCard(c, wk);
    if (wk.kind === 'bjj') h += bjjCard(c, wk);
    else if (wk.kind === 'rest') h += restCard(c, wk);
    else h += workoutCard(c, wk);
    return h + '</section>';
  }

  /* ------------------------------------------------------------------- Today */
  function statusLine(c, pos) {
    var st = c.S.settings;
    if (pos.state === 'before') return 'Your program starts ' + longDate(st.startDate) + ', in ' + pos.daysUntil + (pos.daysUntil === 1 ? ' day.' : ' days.');
    if (pos.state === 'after') return 'You finished all 16 weeks.';
    return c.view.week === pos.week && c.view.day === pos.day ? 'Today is day ' + pos.day + '.' : 'You are looking at another day. Today is week ' + pos.week + ', day ' + pos.day + '.';
  }
  function hero(c, pos) {
    var wk = P.getWorkout(c.view.week, c.view.day), st = c.S.settings;
    var tag = wk.assumed ? '<span class="tag tag-warn">Assumed block, not in your spec</span>' : wk.derived ? '<span class="tag">Built from your Block ' + wk.block + ' rules</span>' : '';
    var onToday = pos.state === 'active' && pos.week === c.view.week && pos.day === c.view.day;
    return '<header class="hero">' +
      '<div class="hero-belt">' + belt(wk.belt) + '<span class="hero-block">Block ' + wk.block + ', ' + esc(wk.blockName) + '</span></div>' +
      '<div class="hero-row"><button class="icon-btn" data-act="wk-prev" aria-label="Previous week">' + ICON.left + '</button>' +
      '<h1 class="hero-week">Week <b>' + c.view.week + '</b><span>of 16</span></h1>' +
      '<button class="icon-btn" data-act="wk-next" aria-label="Next week">' + ICON.right + '</button></div>' +
      '<p class="hero-sub">' + esc(statusLine(c, pos)) + '</p>' +
      '<div class="hero-tags">' + (wk.deload ? '<span class="tag tag-deload">Deload week</span>' : '') + tag +
      (!onToday && pos.state === 'active' ? '<button class="link" data-act="goto-today">Back to today</button>' : '') + '</div></header>';
  }
  function weekStrip(c) {
    var st = c.S.settings, h = '<nav class="strip" aria-label="Days of the week">';
    for (var d = 1; d <= 7; d++) {
      var wk = P.getWorkout(c.view.week, d), iso = E.dateFor(st.startDate, c.view.week, d);
      var cls = 'ds k-' + wk.kind + (d === c.view.day ? ' sel' : '') + (iso === c.today ? ' today' : '');
      h += '<button class="' + cls + '" data-act="pick-day" data-d="' + d + '" aria-label="' + longDate(iso) + ', ' + KIND_NAME[wk.kind] + '"' + (d === c.view.day ? ' aria-current="true"' : '') + '>' +
           '<span class="ds-dow">' + dow(iso) + '</span><span class="ds-num">' + E.parseISO(iso).getDate() + '</span><i class="ds-bar"></i>' +
           (dayDone(c.S, wk) ? '<b class="ds-done">' + ICON.check + '</b>' : '') + '</button>';
    }
    return h + '</nav>';
  }
  function programBanner(c, pos) {
    if (pos.state === 'before') {
      return '<div class="card banner"><p>You can look at any day, or begin week 1 right now.</p><button class="btn btn-ghost" data-act="start-today">Start the program today</button></div>';
    }
    if (pos.state === 'after') {
      return '<div class="card banner"><p>The wave is done. Run it again with weights recalibrated from your logs.</p><button class="btn btn-primary" data-act="restart">Start a new wave</button></div>';
    }
    return '';
  }
  function today(c) {
    var st = c.S.settings, pos = E.position(st.startDate, c.today), wk = P.getWorkout(c.view.week, c.view.day);
    var iso = E.dateFor(st.startDate, c.view.week, c.view.day);
    return hero(c, pos) + weekStrip(c) + programBanner(c, pos) + dayBody(c, wk, iso);
  }

  /* ----------------------------------------------------------------- Program */
  function program(c) {
    var st = c.S.settings, pos = E.position(st.startDate, c.today);
    var h = header('Program', '16 weeks in four blocks. Belts mark the block.');
    h += '<ul class="legend">';
    ['strength', 'bjj', 'recovery', 'speed', 'rest'].forEach(function (k) { h += '<li class="k-' + k + '"><i></i>' + KIND_CODE[k] + ' ' + KIND_NAME[k] + '</li>'; });
    h += '</ul>';
    P.BLOCKS.forEach(function (b) {
      h += '<section class="blk"><header class="blk-head">' + belt(b.belt) + '<div><h2>' + esc(b.name) + '</h2><p>Weeks ' + b.from + '–' + (b.from + 3) + '. ' + esc(b.blurb) + '</p></div></header>';
      for (var w = b.from; w < b.from + 4; w++) {
        var cur = pos.state === 'active' && pos.week === w;
        h += '<div class="wrow' + (cur ? ' cur' : '') + '"><span class="wnum">W' + w + '</span><div class="wdays">';
        for (var d = 1; d <= 7; d++) {
          var wk = P.getWorkout(w, d), iso = E.dateFor(st.startDate, w, d);
          var cls = 'dc k-' + wk.kind + (dayDone(c.S, wk) ? ' done' : '') + (iso === c.today ? ' today' : '');
          h += '<button class="' + cls + '" data-act="open-day" data-w="' + w + '" data-d="' + d + '" aria-label="Week ' + w + ', day ' + d + ', ' + KIND_NAME[wk.kind] + '">' +
               (d === 3 && wk.kind === 'bjj' ? 'N' : KIND_CODE[wk.kind]) + '</button>';
        }
        h += '</div>' + (w - b.from === 3 ? '<span class="wtag">Deload</span>' : '') + '</div>';
      }
      h += '</section>';
    });
    return h;
  }
  function daySheet(c, w, d) {
    var wk = P.getWorkout(w, d), iso = E.dateFor(c.S.settings.startDate, w, d);
    return sheet('Week ' + w + ', day ' + d, dayBody(c, wk, iso));
  }

  /* ------------------------------------------------------------------- Lifts */
  function spark(pts) {
    if (pts.length < 2) return '';
    var W = 220, H = 44, p = 4, min = Infinity, max = -Infinity;
    pts.forEach(function (x) { if (x.e1rm < min) min = x.e1rm; if (x.e1rm > max) max = x.e1rm; });
    if (max === min) { max += 1; min -= 1; }
    var d = pts.map(function (x, i) {
      return (i ? 'L' : 'M') + (p + (W - 2 * p) * i / (pts.length - 1)).toFixed(1) + ' ' + (H - p - (H - 2 * p) * (x.e1rm - min) / (max - min)).toFixed(1);
    }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Estimated 1RM trend"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function projection(c, key) {
    var rm = liftRM(c, key), head = '', row = '';
    for (var w = 1; w <= 16; w++) {
      var ex = P.flatExs(P.getWorkout(w, 1)).concat(P.flatExs(P.getWorkout(w, 5))).filter(function (e) { return e.liftKey === key; })[0];
      var b = P.blockOf(w), cur = c.view.week === w;
      head += '<th class="bk-' + b.belt + (cur ? ' cur' : '') + '">W' + w + '</th>';
      var kg = rm && ex ? E.workingKg(key, rm.kg, ex.pct, c.S.settings) : null;
      var shown = kg == null ? pct(ex.pct) : key === 'pullup' ? (kg > 0 ? '+' + E.fmtW(kg, units(c)) : 'BW') : E.fmtW(kg, units(c));
      row += '<td class="' + (b.deload ? 'dl' : '') + (cur ? ' cur' : '') + '"><b>' + shown + '</b><small>' + ex.sets + '×' + ex.lo + '</small>' + (kg != null ? '<small>' + pct(ex.pct) + '</small>' : '') + '</td>';
    }
    return '<div class="proj"><table><thead><tr>' + head + '</tr></thead><tbody><tr>' + row + '</tr></tbody></table></div>';
  }
  function lifts(c) {
    var u = units(c), h = header('Lifts', 'Your 1RMs drive every working weight in the plan.'), bw = E.bodyKg(c.S.settings);
    E.LIFT_KEYS.forEach(function (k) {
      var rm = liftRM(c, k), pts = E.e1rmPoints(c.S, k), base = c.S.baselines[k];
      var src = !rm ? 'Not set yet' : rm.src === 'baseline' ? 'Entered by you, ' + longDate(rm.date) : rm.src === 'logged' ? 'Best of the last 4 weeks, ' + longDate(rm.date) : 'Last logged ' + longDate(rm.date);
      if (k === 'bss') src += (rm ? '. ' : ' ') + 'Weight held in total, reps per leg';
      if (k === 'pullup' && rm && bw) src += '. Bodyweight ' + E.fmtW(bw, u) + ' + ' + E.fmtW(Math.max(0, rm.kg - bw), u) + ' ' + u + ' added';
      h += '<article class="lift"><header class="lift-head"><div><h2>' + P.LIFT_LABEL[k] + '</h2><p>' + esc(src) + '</p></div>' +
           '<div class="lift-num">' + (rm ? '<b>' + E.fmtW(rm.kg, u) + '</b><small>' + u + totalNote(k) + ' 1RM</small>' : '<b class="dim">–</b>') + '</div></header>' +
           (k === 'pullup' && !bw ? '<div class="note-row"><p>Pull-up weights are bodyweight plus the weight you add, so Hybrid Athlete needs your bodyweight.</p><button class="link" data-act="goto-settings" data-focus="bw">Add bodyweight</button></div>' : '') +
           spark(pts) + projection(c, k) +
           '<div class="lift-act"><button class="btn btn-ghost" data-act="edit-1rm" data-key="' + k + '">' + (rm ? 'Edit 1RM' : 'Set 1RM') + '</button>' +
           (base && pts.length ? '<button class="link" data-act="clear-1rm" data-key="' + k + '">Use logged estimate</button>' : '') + '</div></article>';
    });
    h += '<section class="card calc"><h3>1RM calculator</h3><p class="muted">Epley: weight × (1 + reps ÷ 30). A single rep counts as the 1RM. For pull-ups, enter the weight you added (0 for bodyweight only); your bodyweight comes from Settings.</p>' +
         '<div class="calc-row"><label>Weight<input class="in" id="calc-w" type="text" inputmode="decimal" placeholder="' + u + '" autocomplete="off"></label>' +
         '<label>Reps<input class="in" id="calc-r" type="text" inputmode="numeric" placeholder="reps" autocomplete="off"></label></div>' +
         '<p class="calc-out" id="calc-out" aria-live="polite">Enter a weight and reps.</p>' +
         '<div class="calc-row"><label>Save as<select class="in" id="calc-k">' + E.LIFT_KEYS.map(function (k) { return '<option value="' + k + '">' + P.LIFT_LABEL[k] + '</option>'; }).join('') + '</select></label>' +
         '<button class="btn btn-ghost" data-act="calc-save">Use as 1RM</button></div></section>';
    h += '<section class="hist"><h2>Recent sessions</h2>';
    var recent = c.S.logs.slice(-8).reverse();
    if (!recent.length) h += '<p class="muted empty">Nothing logged yet. Finish a workout and it shows up here.</p>';
    recent.forEach(function (l) {
      var cnt = 0; l.entries.forEach(function (e) { cnt += e.sets.length; });
      h += '<div class="hrow"><div><b>' + esc(l.title) + '</b><span>' + longDate(l.date) + ', week ' + l.week + ', ' + cnt + ' sets' + (l.volumeKg ? ', ' + fmtInt(E.toDisp(l.volumeKg, u)) + ' ' + u : '') + '</span></div>' +
           '<button class="icon-btn" data-act="del-log" data-id="' + esc(l.id) + '" aria-label="Delete this session">' + ICON.x + '</button></div>';
    });
    return h + '</section>';
  }

  /* ------------------------------------------------------------------- Ducky */
  function ducky(c) {
    var h = header('Ducky', 'Your coach. It only speaks when you ask.');
    if (!c.hasKey) {
      h += '<div class="card banner"><p>Ducky runs on your own Google Gemini API key. It is stored only on this device.</p><button class="btn btn-primary" data-act="goto-settings" data-focus="key">Add API key</button></div>';
    }
    h += '<div class="chat" id="chat" aria-live="polite">';
    if (!c.S.chat.length) {
      h += '<div class="chat-empty">' + ICON.duck + '<p>Ask about today’s session, a movement, or how to adjust when something is off.</p></div>';
    }
    c.S.chat.forEach(function (m, i) {
      if (m.role === 'user') { h += '<div class="msg me"><p>' + esc(m.text).replace(/\n/g, '<br>') + '</p></div>'; return; }
      h += '<div class="msg duck"><span class="avatar">' + ICON.duck + '</span><div class="bubble">' + AI.md(m.text);
      if (m.yt) h += '<a class="yt" href="' + esc(m.yt.url) + '" target="_blank" rel="noopener noreferrer">' + ICON.play + 'Watch: ' + esc(m.yt.name) + '</a>';
      if (m.mods && m.mods.length) {
        h += '<div class="mods"><ul>' + m.mods.map(function (x) {
          var bits = [];
          if (x.skip) bits.push('skip'); if (x.sets) bits.push(x.sets + ' sets'); if (x.reps) bits.push(x.reps + ' reps'); if (x.weightFactor) bits.push(Math.round(x.weightFactor * 100) + '% weight');
          return '<li><b>' + esc(x.exercise) + '</b> ' + esc(bits.join(', ')) + '</li>';
        }).join('') + '</ul>' +
        (m.applied ? '<p class="applied">' + ICON.check + esc(m.applied) + '</p>' : '<button class="btn btn-primary" data-act="apply-mods" data-i="' + i + '">Apply to ' + (c.S.active ? 'this workout' : 'the day’s workout') + '</button>') + '</div>';
      }
      h += '</div></div>';
    });
    if (c.ui && c.ui.pending) h += '<div class="msg duck"><span class="avatar">' + ICON.duck + '</span><div class="bubble typing" aria-label="Ducky is typing"><i></i><i></i><i></i></div></div>';
    if (c.ui && c.ui.error) h += '<div class="msg err" role="alert"><p>' + esc(c.ui.error) + '</p></div>';
    h += '</div>';
    h += '<div class="chips"><button class="chip" data-act="duck-modify">Modify today’s workout</button><button class="chip" data-act="duck-how">How do I perform…</button>' +
         '<button class="chip" data-act="duck-ask" data-q="I’m very fatigued today. What should I change?">I’m fatigued</button>' +
         (c.S.chat.length ? '<button class="chip chip-quiet" data-act="duck-clear">Clear chat</button>' : '') + '</div>';
    h += '<form class="composer" data-form="ducky"><textarea id="duck-input" rows="1" placeholder="Ask Ducky" aria-label="Message Ducky" enterkeyhint="send"></textarea>' +
         '<button class="send" type="submit" aria-label="Send">' + ICON.send + '</button></form>';
    return h;
  }
  function modifySheet(c) {

<script>
/* ---- app.js ---- */

  }
  function doAct(act, el, ev) {
    var st = S(), c;
    switch (act) {
      case 'reload': location.reload(); break;
      /* navigation */
      case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); if (tab === 'ducky') scrollChat(); break;

        if (target) { target.scrollIntoView({ block: 'center' }); if (el.dataset.focus === 'bw') target.focus(); }
        break;
      case 'goto-lifts': closeSheet(); tab = 'lifts'; render(); window.scrollTo(0, 0); break;
      case 'goto-today': view = A.viewFor(st, today()); tab = 'today'; render(); break;
      case 'wk-prev': view.week = Math.max(1, view.week - 1); render(); break;
      case 'wk-next': view.week = Math.min(16, view.week + 1); render(); break;

      case 'open-day': openSheet(function () { return V.daySheet(ctx(), +el.dataset.w, +el.dataset.d); }); break;

        } else if (lastTick && lastTick.it === l.it && lastTick.ex === l.ex && lastTick.set === l.set && T.state().active) {
          T.cancel(); persistRest();
        }

      case 'rm-set': if (!A.removeSet(st, loc(el))) toast('Untick a set to remove it.'); save(); repaintBody(); break;
      case 'add-round': A.addRound(st, +el.dataset.it); save(); repaintBody(); break;
      case 'rm-round': if (!A.removeRound(st, +el.dataset.it)) toast('Untick a set to remove a round.'); save(); repaintBody(); break;
      case 'skip-ex': A.skipEx(st, loc(el), true); save(); repaintBody(); break;
      case 'unskip': A.skipEx(st, loc(el), false); save(); repaintBody(); break;
      case 'ask-duck': sendDucky('How do I perform ' + el.dataset.name + '?'); break;

      /* install and offline */

      case 'clear-1rm': A.clearBaseline(st, el.dataset.key); store.flush(); render(true); toast('Using your logged estimate.'); break;

        break;

      case 'duck-how': openSheet(function () { return V.howSheet(ctx()); }); break;

        var ru = el.dataset.uid;
        A.resetMove(st, ru); closeSheet(); store.flush(); render(true); toast('Back to the program time.'); queuePush([ru]);
        break;

      /* running: live heart rate, logged runs */
      case 'live-open': openLive(); break;
      case 'live-close': closeLive(); break;
      case 'live-connect': liveConnect(false); break;
      case 'live-connect-all': liveConnect(true); break;
      case 'live-disconnect': HR.disconnect(); paintLive(true); break;
      case 'live-manual': liveManual(); break;
      case 'live-start': liveStart(); break;
      case 'live-stop': liveStop(); break;
      case 'run-log': runDraft = {}; openSheet(function () { return V.runSheet(ctx(), runDraft); }, 'run-time'); break;
      case 'run-save': saveRun(); break;
      case 'run-del': A.deleteRun(st, el.dataset.id); store.flush(); render(true); toast('Run deleted.'); break;

      /* Google Calendar */
      case 'gcal-connect': case 'gcal-sync': gcalRun(true); break;
      case 'gcal-force': gcalRun(true, { force: true }); break;
      case 'gcal-disconnect': G.disconnect(); gcalErr = ''; render(true); toast('Disconnected. The calendar stays in your Google account.'); break;

      /* settings */
      case 'cal-download':
        c = buildICS(); deliverICS(c.text); toast(c.count + ' events ready.');
        break;
      case 'key-save':
        var kv = $('key-input').value.trim();
        if (!kv) { $('key-result').textContent = 'Paste your key first.'; break; }
        store.setKey(kv); render(true); $('key-result').textContent = 'Saved on this device.';
        break;
      case 'key-test': testKey(); break;
      case 'key-clear': store.setKey(''); render(true); toast('API key removed.'); break;
      case 'data-export': download('hybrid-athlete-backup-' + today() + '.json', 'application/json', store.exportJSON()); toast('Backup downloaded.'); break;
      case 'data-reset':
        openSheet(function () { return V.confirmSheet('Erase everything?', 'Your logs, 1RMs, settings and API key are deleted from this device. This cannot be undone.', 'data-reset-go', 'Erase everything'); });
        break;
      case 'data-reset-go':
        T.cancel(); persistRest(); T.keepAwake(false); store.setKey(''); try { G.disconnect(); } catch (e) { /* ignore */ } HR.disconnect(); runDraft = {}; gcalErr = ''; store.reset();
        closeSheet(); closeWorkout(); view = A.viewFor(S(), today()); tab = 'today'; ui = { pending: false, error: null, draft: '' };
        render(); window.scrollTo(0, 0); toast('All data erased.');
        break;
      default: break;
    }
  }

  async function testKey() {
    var out = $('key-result'), typed = $('key-input').value.trim(), key = typed || store.getKey();
    if (!key) { out.textContent = 'Paste your key first.'; return; }
    out.textContent = 'Testing…';
    try {
      var r = await AI.ask({ key: key, model: S().settings.geminiModel, system: 'Reply with the single word OK.', history: [], user: 'ping' });
      out.textContent = 'Works. Answered by ' + r.model + '.';
      if (typed) { store.setKey(typed); $('key-input').value = ''; }
    } catch (e) { out.textContent = e.message; }
  }

  document.addEventListener('click', function (ev) {
    var open = document.querySelectorAll('details.more[open]');
    if (open.length) open.forEach(function (d) { if (!d.contains(ev.target)) d.removeAttribute('open'); });
    var el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    // a tap on the sheet content must not fall through to the backdrop
    if (el.classList.contains('sheet-bd') && ev.target !== el) return;
    onAct(el.dataset.act, el, ev);
  });

  /* ------------------------------------------------------------ typing / forms */
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.matches && t.matches('.srow input[data-f]')) {
      A.setField(S(), loc(t), t.dataset.f, t.value);
      save();
      if (t.dataset.f === 'w') {                          // the % of 1RM follows the weight you type
        var l = loc(t), rmEl = $('rm-' + l.it + '-' + l.ex), exo = A.exAt(S().active, l.it, l.ex);
        if (rmEl && exo) rmEl.textContent = V.rmLine(ctx(), exo, l.set);
      }
    } else if (t.id === 'calc-w' || t.id === 'calc-r') calcOut();
    else if (t.id === 'duck-input') autoGrow(t);
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, st = S();
    if (t.dataset && t.dataset.actChange === 'data-import') { importFile(t); return; }
    if (t.dataset && t.dataset.actChange === 'run-import') { importRun(t); return; }
    if (t.id === 'calc-k') { calcOut(); return; }
    // set-row inputs also carry data-set (the set index): only settings fields have data-type
    var path = t.dataset && t.dataset.type ? t.dataset.set : null;
    if (!path) return;
    var type = t.dataset.type, val = type === 'bool' ? t.checked : t.value;
    if (!A.setSetting(st, path, val)) { toast(path === 'raceTime' ? 'Use minutes and seconds, like 25:00.' : 'That value does not work. Use a number.'); render(true); return; }
    store.flush();
    if (path === 'units' || path === 'bodyKg' || path === 'paceUnit') render(true);
    else if (/^(age|rhr|mhr|mhrFormula|hrMethod|zoneLo|zoneHi)$/.test(path)) { refreshZoneLine(); refreshPace(); }
    else if (path === 'raceDist' || path === 'raceTime') refreshPace();
    else if (path === 'gcalClientId') {                     // a different client id cannot reach the old calendar: start clean
      G.forget(); gcalErr = ''; if (clientId()) G.preload().catch(function () { /* shown when you tap Connect */ });
      var cb = document.querySelector('[data-act="gcal-connect"]'); if (cb) cb.disabled = !clientId();
      refreshGcalUI(false);                                 // no redraw here: the tap that caused this change may be on a button
    }
    else if (path === 'startDate') { view = A.viewFor(st, today()); queuePush(null); }
    else if (/^times\./.test(path)) queuePush(null);
    else if (path === 'includeRest') queuePush(null, true);
    else if (path === 'wakeLock') T.keepAwake(!!st.active && workoutOpen);
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.dataset && ev.target.dataset.form === 'ducky') {
      ev.preventDefault();
      var inp = $('duck-input'), txt = inp.value; inp.value = ''; autoGrow(inp);
      sendDucky(txt);
    }
  });
  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (ev.key === 'Enter' && !ev.shiftKey && t.id === 'duck-input') { ev.preventDefault(); t.form.requestSubmit(); }
    else if (ev.key === 'Enter' && t.id === 'lr-manual') { ev.preventDefault(); liveManual(); }
    else if (ev.key === 'Enter' && t.matches && t.matches('.srow input')) t.blur();
    else if (ev.key === 'Escape') { if (curSheet) closeSheet(); else if (liveOpen) closeLive(); else if (workoutOpen) closeWorkout(); }
  });
  document.addEventListener('focusin', function (ev) {
    if (ev.target.matches && ev.target.matches('.srow input')) setTimeout(function () { try { ev.target.select(); } catch (e) { /* ignore */ } }, 0);
  });

  function importFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var r = store.importJSON(String(rd.result));
      input.value = '';
      if (!r.ok) { toast(r.error); return; }
      view = A.viewFor(S(), today()); render(); toast('Imported ' + r.logs + ' logged sessions.');
    };
    rd.onerror = function () { toast('Could not read that file.'); };
    rd.readAsText(f);
  }

  /* -------------------------------------------------------------------- boot */
  window.addEventListener('pagehide', function () { store.flush(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') store.flush();
    else { tickPill(); paintRest(); autoSync(); }
  });
  window.addEventListener('online', function () { queuePush(null); });

  function boot() {
    store.load();
    view = A.viewFor(S(), today());
    render();
    restoreRest();
    if (clientId()) G.preload().catch(function () { /* shown when you tap Connect */ });
    autoSync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not available */ }
    registerSW();
  }

  /* A service worker must be its own file (browsers refuse one from a blob: or data: URL, or from the page
     itself). So: if sw.js sits next to this page, register it; if not, the app runs fine without it and
     Settings offers the embedded copy to save. */
  function pwaChanged() { if (tab === 'settings' && !workoutOpen && !curSheet) render(true); }
  function registerSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { pwa.sw = 'unsupported'; return; }
    fetch('sw.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var js = /javascript|ecmascript/i.test(r.headers.get('content-type') || '');
      if (!r.ok || !js) { pwa.sw = 'absent'; pwaChanged(); return; }
      return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
        .then(function () { pwa.sw = 'active'; pwaChanged(); });
    }).catch(function (e) { pwa.sw = pwa.sw === 'checking' ? 'absent' : 'error'; pwa.err = e && e.message ? String(e.message).slice(0, 120) : ''; pwaChanged(); });
  }
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); pwa.deferred = ev; pwaChanged(); });
  window.addEventListener('appinstalled', function () { pwa.deferred = null; pwa.installed = true; pwaChanged(); toast('Installed.'); });
  boot();

  // exposed so the app can be inspected from the console
  window.HA.app = { render: render, openWorkout: openWorkout };
})();
</script>
<script type="text/plain" id="ha-sw-source">
// Generated for the single-file page by build-single.js. Save it as sw.js next to that page.
/* Service worker: makes the app work offline and delivers the "rest is over" notification when the page
   itself has been frozen by the browser (screen off, app in the background).
   Bump CACHE whenever a shipped file changes.
   The two BUILD lines are rewritten by build-single.js for the single-file page (index-single.html), which has
   nothing to cache but the page itself; there a missing file must not stop the worker installing. */
'use strict';
var CACHE = 'ha-v4';
var SHELL = ['./'];   // BUILD:SHELL
var STRICT = false;   // BUILD:STRICT

function precache(c) {
  if (STRICT) return c.addAll(SHELL);
  return Promise.all(SHELL.map(function (u) { return c.add(u).catch(function () { /* optional */ }); }));
}

self.addEventListener('install', function (e) {
  e.waitUntil(caches.open(CACHE).then(precache).then(function () { return self.skipWaiting(); }));
});
self.addEventListener('activate', function (e) {
  e.waitUntil(
    caches.keys().then(function (keys) { return Promise.all(keys.filter(function (k) { return k !== CACHE; }).map(function (k) { return caches.delete(k); })); })
      .then(function () { return self.clients.claim(); })
  );
});

// Same-origin GETs: answer from the cache at once, refresh it in the background. Gemini calls are never touched.
self.addEventListener('fetch', function (e) {
  var req = e.request, url = new URL(req.url);
  if (req.method !== 'GET' || url.origin !== self.location.origin) return;
  e.respondWith(
    caches.open(CACHE).then(function (cache) {
      return cache.match(req, { ignoreSearch: true }).then(function (hit) {
        var net = fetch(req).then(function (res) {
          if (res && res.ok) cache.put(req, res.clone());
          return res;
        }).catch(function () {
          if (hit) return hit;
          if (req.mode !== 'navigate') return Response.error();
          return cache.match('index.html').then(function (p) { return p || cache.match('./'); }).then(function (p) { return p || Response.error(); });
        });
        return hit || net;
      });
    })
  );
});

/* ---- rest timer fallback ------------------------------------------------------------------
   The page asks us to wake at the end of the rest. We aim 1.5 s after the page's own timer so that,
   when the page is still alive, it cancels us first and the user gets one alert, not two. */
var restTimer = null, restDone = null;

function cancelRest() {
  if (restTimer) { clearTimeout(restTimer); restTimer = null; }
  if (restDone) { restDone(); restDone = null; }
}
function appVisible() {
  return self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(function (list) {
    return list.some(function (c) { return c.visibilityState === 'visible'; });
  });
}
self.addEventListener('message', function (e) {
  var d = e.data || {};
  if (d.type === 'rest-cancel') { cancelRest(); return; }
  if (d.type !== 'rest-schedule') return;
  cancelRest();
  var wait = Math.max(0, (d.at || 0) - Date.now()) + 1500;
  // waitUntil keeps the worker alive for the length of the rest (browsers allow a few minutes)
  e.waitUntil(new Promise(function (resolve) {
    restDone = resolve;
    restTimer = setTimeout(function () {
      restTimer = null; restDone = null;
      appVisible().then(function (visible) {
        if (visible) return;
        return self.registration.showNotification('Rest is over', {
          body: d.body || 'Time for your next set.', tag: 'ha-rest', renotify: true,
          vibrate: [220, 90, 220, 90, 500], icon: d.icon || 'icon-192.png', badge: d.icon || 'icon-192.png'
        });
      }).catch(function () { /* no notification permission */ }).then(resolve);
    }, wait);
  }));
});

self.addEventListener('notificationclick', function (e) {
  e.notification.close();
  e.waitUntil(self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(function (list) {
    for (var i = 0; i < list.length; i++) if ('focus' in list[i]) return list[i].focus();
    return self.clients.openWindow('./');
  }));
});
</script>
